    fieldName: MIL_STATUS
    choiceType: TRANSLATE_VALUE
    dynamic: false
    values:
      - { storedValue: N, displayText: 未服役, languageCode: ZHT, status: ACTIVE }
      - { storedValue: S, displayText: 服役中, languageCode: ZHT, status: ACTIVE }
      - { storedValue: D, displayText: 已退伍, languageCode: ZHT, status: ACTIVE }
      - { storedValue: E, displayText: 免役,   languageCode: ZHT, status: ACTIVE }
      - { storedValue: A, displayText: 替代役, languageCode: ZHT, status: ACTIVE }
  - recordName: TW_MILITARY
    fieldName: HANDLER_EMPLID
    choiceType: PROMPT_TABLE
    dynamic: false
    highCardinality: true                 # 約 30000 筆 → 不可全量回傳
    approxRowCount: 30000
    promptRecord: PERSONAL_DATA
    keyFields: [EMPLID]
    displayFields: [NAME, TW_NAME_ENG]
    searchFields: [EMPLID, NAME]
