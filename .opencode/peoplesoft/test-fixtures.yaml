# =============================================================================
# PeopleSoft Skills 測試 Fixtures（假想環境 TEST）
# =============================================================================
# test-scenarios.md 全部題目的標準答案來源。
# 之後實作 mock MCP server 時，各工具直接依本檔回應：
#   ps_get_object_origin      → objects[].origin
#   ps_search_ui_semantics    → uiSemantics / choices
#   ps_get_field_choices      → choices
#   ps_search_source          → sourceChunks（只回 snippet 當 candidate）
#   ps_get_source_chunks      → sourceChunks（回完整 content 當 evidence）
#   ps_get_source_outline     → outlines
#   ps_get_data_lineage       → lineage
#   ps_get_process_usage      → processes
#   ps_get_security_path      → security
# =============================================================================

