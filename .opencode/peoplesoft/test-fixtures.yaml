    fieldName: EXEMPT_RSN
    choiceType: DYNAMIC_PEOPLECODE
    dynamic: true
    status: DYNAMIC_RUNTIME
    evidence: [CHK-PC-004]

outlines:
  - sourceType: SQR
    sourceId: SQR-TW_MIL001
    sections:
      - { symbol: BEGIN-PROGRAM,                startLine: 1,   endLine: 20,  calls: [MAIN] }
      - { symbol: BEGIN-PROCEDURE MAIN,         startLine: 21,  endLine: 60,  calls: [UPDATE-MIL-STATUS, LOAD-HISTORY, PRINT-REPORT] }
      - { symbol: BEGIN-PROCEDURE UPDATE-MIL-STATUS, startLine: 61, endLine: 120, chunkId: CHK-SQR-001 }
      - { symbol: BEGIN-PROCEDURE LOAD-HISTORY, startLine: 121, endLine: 160, chunkId: CHK-SQR-003 }
      - { symbol: BEGIN-PROCEDURE PRINT-REPORT, startLine: 161, endLine: 220, chunkId: CHK-SQR-002 }
      - { symbol: "#include 'twmilutil.sqc'",   startLine: 221, endLine: 221 }

sourceChunks:
  # --- PeopleCode ---
  - chunkId: CHK-PC-001
    sourceType: PEOPLECODE
    sourceId: TW_MILITARY.MIL_STATUS.FieldChange
    parentSymbol: FieldChange
    startLine: 1
    endLine: 14
    content: |
      If TW_MILITARY.MIL_STATUS = "E" Then
         TW_MILITARY.EXEMPT_RSN.Enabled = True;
         TW_MILITARY.EXEMPT_DT = %Date;
      Else
         TW_MILITARY.EXEMPT_RSN.Enabled = False;
         TW_MILITARY.EXEMPT_RSN = "";
         TW_MILITARY.EXEMPT_DT = null;
      End-If;
  - chunkId: CHK-PC-002
    sourceType: PEOPLECODE
    sourceId: TW_MILITARY.MIL_STATUS.SavePostChange
    parentSymbol: SavePostChange
    startLine: 1
    endLine: 10
    content: |
      Declare Function fmt_audit_user PeopleCode HR_COMMON_UTIL.FUNCLIB FieldFormula;
      SQLExec("INSERT INTO PS_TW_MIL_LOG (EMPLID, MIL_STATUS, AUDIT_USER, AUDIT_DTTM)
               VALUES (:1, :2, :3, %CurrentDateTimeIn)",
               TW_MILITARY.EMPLID, TW_MILITARY.MIL_STATUS, fmt_audit_user(%UserId));
  - chunkId: CHK-PC-003                    # D1：動態 SQL
    sourceType: PEOPLECODE
    sourceId: TW_MILITARY.MIL_STATUS.SavePostChange
    parentSymbol: SavePostChange
    startLine: 11
    endLine: 18
    content: |
      /* 核准後回寫目標表由設定檔決定 */
      &tbl = TW_MIL_CFG.TARGET_TBL.Value;
      &sql = "UPDATE PS_" | &tbl | " SET MIL_APPROVED = 'Y' WHERE EMPLID = :1";
      SQLExec(&sql, TW_MILITARY.EMPLID);
  - chunkId: CHK-PC-004                    # B5 / D3：動態 Label 與動態選項
    sourceType: PEOPLECODE
    sourceId: TW_MILITARY.EXEMPT_RSN.RowInit
    parentSymbol: RowInit
    startLine: 1
    endLine: 12
    content: |
      If %Language = "ZHT" Then
         TW_MILITARY.EXEMPT_RSN.Label = "免役原因（" | TW_MIL_CFG.YEAR | "年度）";
      End-If;
      TW_MILITARY.EXEMPT_RSN.ClearDropDownList();
      SQLExec("SELECT RSN_CD, RSN_DESC FROM PS_TW_MIL_RSN WHERE EFF_STATUS='A'", ...);
      /* 迴圈 AddDropDownItem(&cd, &desc) */

  # --- SQL Definition ---
  - chunkId: CHK-SQL-001
    sourceType: SQL_DEFINITION
    sourceId: TW_MIL_UPD_SQL
    parentSymbol: TW_MIL_UPD_SQL
    startLine: 1
    endLine: 8
    metadata:
      statementType: UPDATE
      referencedTables:
        - { table: PS_TW_MILITARY, readWriteType: UPDATE }
        - { table: PS_TW_MIL_ELIG, readWriteType: READ }
      bindVariables: [":1", ":2"]
    content: |
      UPDATE PS_TW_MILITARY A
         SET A.MIL_STATUS = :1
       WHERE A.EMPLID = :2
         AND EXISTS (SELECT 'X' FROM PS_TW_MIL_ELIG B
                      WHERE B.EMPLID = A.EMPLID AND B.ELIG_FLG = 'Y')

  # --- SQR / SQC ---
  - chunkId: CHK-SQR-001
    sourceType: SQR
    sourceId: SQR-TW_MIL001
    parentSymbol: UPDATE-MIL-STATUS
    startLine: 61
    endLine: 120
    content: |
      begin-procedure UPDATE-MIL-STATUS
      begin-sql
      UPDATE PS_TW_MILITARY
         SET MIL_STATUS = 'D'
       WHERE MIL_STATUS = 'S'
         AND DISCHARGE_DT <= SYSDATE
      end-sql
      do GET-MIL-DESC('D', $desc)
      end-procedure
  - chunkId: CHK-SQR-002
    sourceType: SQR
    sourceId: SQR-TW_MIL001
    parentSymbol: PRINT-REPORT
    startLine: 161
    endLine: 220
    content: |
      begin-procedure PRINT-REPORT
      begin-select
      A.EMPLID, A.MIL_STATUS
        do GET-MIL-DESC(&A.MIL_STATUS, $desc)
        print &A.EMPLID (+1,1)
        print $desc     (,20)
      from PS_TW_MILITARY A
      end-select
      end-procedure
  - chunkId: CHK-SQR-003                   # D2：動態 table
    sourceType: SQR
    sourceId: SQR-TW_MIL001
    parentSymbol: LOAD-HISTORY
    startLine: 121
    endLine: 160
    content: |
      begin-procedure LOAD-HISTORY
      let $hist_table = 'PS_TW_MIL_HIST_' || $prcs_yr
      begin-select
      H.EMPLID, H.MIL_STATUS
      from [$hist_table] H
      end-select
      end-procedure
  - chunkId: CHK-SQC-001                   # C3：SQC 內的共用程序
    sourceType: SQC
    sourceId: SQC-TWMILUTIL
    parentSymbol: GET-MIL-DESC
    startLine: 1
    endLine: 20
    content: |
      begin-procedure GET-MIL-DESC($cd, :$desc)
      evaluate $cd
        when = 'N'
          let $desc = '未服役'
        when = 'S'
          let $desc = '服役中'
        when = 'D'
          let $desc = '已退伍'
        when = 'E'
          let $desc = '免役'
        when = 'A'
          let $desc = '替代役'
      end-evaluate
      end-procedure

  # --- AE ---
  - chunkId: CHK-AE-001
    sourceType: AE_SQL
    sourceId: TW_MIL_AE.MAIN.Step010
    parentSymbol: MAIN.Step010.SQL
    startLine: 1
    endLine: 6
    content: |
      UPDATE PS_TW_MILITARY
         SET MIL_STATUS = 'S'
       WHERE MIL_STATUS = 'N'
         AND ENLIST_DT <= %CurrentDateIn

lineage:
  - target: TW_MILITARY.MIL_STATUS
    edges:
      - { source: "PeopleCode TW_MILITARY.MIL_STATUS (Component 存檔)", operation: UPDATE, evidence: [CHK-PC-001, CHK-PC-002] }
      - { source: "SQR TW_MIL001.UPDATE-MIL-STATUS",                    operation: UPDATE, evidence: [CHK-SQR-001] }
      - { source: "AE TW_MIL_AE.MAIN.Step010",                          operation: UPDATE, evidence: [CHK-AE-001] }
      - { source: "SQL TW_MIL_UPD_SQL",                                 operation: UPDATE, evidence: [CHK-SQL-001] }
      - { source: "PeopleCode 動態回寫（PS_ + 設定值）",                 operation: DYNAMIC_RUNTIME, evidence: [CHK-PC-003] }
      - { source: "SQR TW_MIL001.PRINT-REPORT",                         operation: READ,   evidence: [CHK-SQR-002] }

